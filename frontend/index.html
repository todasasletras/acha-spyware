<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acha Spyware</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-dark text-light d-flex justify-content-center align-items-center min-vh-100">

  <div class="container text-center">
    <!-- Header -->
    <header class="row">
      <div class="d-flex flex-column-reverse flex-md-row justify-content-between align-items-center my-5">
        
        <!-- Título + API -->
        <div class="w-md-auto">
          <h1 class="mb-4">#Acha Spyware - Sistemas Android</h1>
          
          <div class="d-flex flex-column flex-md-row justify-content-center align-items-center">
            <label for="apiKeyInput" class="labelApiKey me-md-2 mb-2 mb-md-0 text-center text-md-start">API do VirusTotal:</label>
            <input id="apiKeyInput" type="text" class="form-control mb-2 mb-md-0 w-100 w-md-50" placeholder="Digite a API Key">
            <button id="btnEnviarApiKey" class="btn button-submit ms-md-2 w-100 w-md-auto">Enviar</button>
            <a class="ps-md-3 mt-2 mt-md-0" href="/info">
              <img src="{{ url_for('static', filename='images/info-icon.svg') }}" alt="Mais informações" height="24">
            </a>
          </div>

          <div id="resultadoApiKey" class="mt-4 text-start"></div>
        </div>

        <!-- Logo -->
        <div class="mb-4 mb-md-0">
          <img src="{{ url_for('static', filename='images/acha-spyware.png') }}" alt="Logo Acha Spyware">
        </div>

      </div>
    </header>


    <!-- Botões -->
    <div class="row justify-content-center">
      <div class="col-12 col-md-5 mb-md-4">
        <button id="btnVerificarAdb" class="button w-100 position-relative">
          <span class="button-text">Verificar Dispositivo conectado</span>
          <span class="spinner d-none position-absolute top-50 start-50 translate-middle"></span>
        </button>
        <div class="note"># Necessário baixar e instalar o Android Debug Bridge</div>
      </div>

      <div class="col-12 col-md-5 mb-md-4">
        <button class="button w-100">
          <span class="button-text">Verificar Backup</span>
        </button>
        <div class="note"># Precisa já ter feito a verificação do aparelho conectado</div>
      </div>

      <div class="col-12 col-md-5 mb-md-4">
        <button class="button w-100">
          <span class="button-text">Atualizar indicadores de comprometimento</span>
        </button>
      </div>

      <div class="col-12 col-md-5 mb-md-4">
        <button class="button w-100">
          <span class="button-text">Download APK</span>
        </button>
      </div>
    </div>

    <!-- Resultado -->
    <div id="resultado" class="my-5"></div>
  </div>

  <script src="{{ url_for('static', filename='bootstrap-5/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
