<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acha Spyware</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5/css/bootstrap.css') }}">
</head>
<body class="bg-dark text-light">
    <div class="container">
        <div class="mb-5 gap-2 d-flex justify-content-between">
            <div class="d-flex flex-column align-items-center">
                <h1 class="text-light my-4">#Acha Spyware - Sistemas Android</h1>
                <div class="input-group">
                    <label class="labelApiKey">Insira a chave de API <br/>do Vírus Total</label>
                    <input id="apiKeyInput" class="form-control" type="text" placeholder="API Key" aria-label="API Key" />
                    <button id="btnEnviarApiKey" class="btn button-submit">
                        Enviar
                    </button>
                    <a class="ps-3" href="/info">
                        <img src="{{ url_for('static', filename='images/info-icon.svg') }}" alt="Obter mais informações"/>
                    </a>
                </div>
            </div>
            <img src="static/images/acha-spyware.png" alt="Acha Spyware Logo"/>
        </div>
        
        <div class="row">
            <div class="button-container">
                <!-- Transformando a div em um botão -->
                <button class="button button-bg" id="btnVerificarAdb">
                    <span class="button-text">Verificar Dispositivo conectado</span>
                    <span class="spinner d-none"></span>
                </button>
                <div class="note"># Necessário baixar e instalar o Android Debug Bridge</div>
            </div>
            <div class="button-container">
                <button class="button">
                    <div class="button-bg"></div>
                    <span class="button-text">Verificar Backup</span>
                </button>
                <div class="note"># Precisa já ter feito a verificação do aparelho conectado</div>
            </div>
        </div>

        <div class="row">
            <div class="button-container">
                <button class="button">
                    <div class="button-bg"></div>
                    <span class="button-text">Atualizar indicadores de comprometimento</span>
                </button>
            </div>
            <div class="button-container">
                <button class="button">
                    <div class="button-bg"></div>
                    <span class="button-text">Download APK</span>
                </button>
            </div>
        </div>

        <div class="row">
            <div class="container-result">
                <p id="resultado"></p>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='bootstrap-5/js/bootstrap.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}" defer></script>
</body>
</html>
